<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OG3 Quality Education — Coordination Dashboard</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#F0F5FA;color:#1A2533;font-size:13px}
:root{--blue:#1CABE2;--navy:#003A5D;--green:#00833D;--amber:#E6A817;--red:#C0392B;--teal:#006D77;--purple:#6C3B8C;--border:#DDE6EE;--muted:#6B7A8D;--card:#fff}
.hdr{background:linear-gradient(135deg,#003A5D 0%,#1CABE2 100%);color:#fff;padding:20px 28px}
.hdr-brand{display:flex;align-items:center;gap:14px}
.hdr-icon{width:50px;height:50px;background:rgba(255,255,255,.15);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px}
.hdr-title{font-size:20px;font-weight:700}
.hdr-sub{font-size:12px;opacity:.8;margin-top:2px}
.hdr-right{margin-left:auto;text-align:right;font-size:12px;opacity:.85}
.refresh-bar{background:#E3F5FC;border-bottom:1px solid #C9E8F5;padding:8px 24px;display:flex;align-items:center;justify-content:space-between}
.refresh-bar span{font-size:11px;color:#0077B5;font-weight:500}
.refresh-btn{background:var(--blue);color:#fff;border:none;padding:6px 16px;border-radius:6px;cursor:pointer;font-size:11px;font-weight:600}
.tabs{display:flex;background:#fff;border-bottom:1px solid var(--border);padding:0 20px;overflow-x:auto;gap:2px}
.tab{padding:11px 14px;font-size:12px;cursor:pointer;border-bottom:3px solid transparent;color:var(--muted);white-space:nowrap;font-weight:500}
.tab.active{color:var(--blue);border-bottom-color:var(--blue)}
.content{padding:20px 24px;max-width:1200px;margin:0 auto}
.card{background:var(--card);border-radius:10px;border:1px solid var(--border);padding:18px;margin-bottom:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.sec-title{font-size:14px;font-weight:600;color:#1A2533;margin-bottom:12px}
.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600}
.b-blue{background:#E3F5FC;color:#0077B5}
.b-green{background:#E6F7EE;color:#00833D}
.b-amber{background:#FEF5E3;color:#B8760A}
.b-red{background:#FDE8E7;color:#C0392B}
.b-grey{background:#EDF0F3;color:#6B7A8D}
.b-purple{background:#F0EBF7;color:#6C3B8C}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;padding:8px 10px;font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);border-bottom:2px solid var(--border);font-weight:600;background:#FAFBFC}
td{padding:9px 10px;border-bottom:1px solid #EDF0F3;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#FAFBFC}
.open-btn{display:inline-block;padding:3px 10px;color:#fff;border-radius:5px;font-size:11px;text-decoration:none;font-weight:500}
.dl-ok{font-size:11px;color:var(--muted)}
.dl-warn{font-size:11px;color:#B8760A;font-weight:600}
.dl-danger{font-size:11px;color:#C0392B;font-weight:600}
.dl-past{font-size:11px;color:#B0BEC5}
.tl{position:relative;padding-left:22px}
.tl::before{content:'';position:absolute;left:7px;top:0;bottom:0;width:2px;background:var(--border)}
.tl-item{position:relative;margin-bottom:16px}
.tl-dot{position:absolute;left:-19px;top:3px;width:12px;height:12px;border-radius:50%;border:2px solid #fff}
.tl-date{font-size:11px;color:var(--muted);margin-bottom:2px}
.tl-title{font-size:13px;font-weight:500}
.tl-sub{font-size:11px;color:var(--muted)}
.prog-wrap{background:#EDF0F3;border-radius:4px;height:8px;overflow:hidden;width:130px;margin-top:4px}
.prog{height:8px;border-radius:4px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-top:8px}
.cal-dh{text-align:center;font-size:10px;color:var(--muted);padding:4px;font-weight:600}
.cal-day{text-align:center;padding:5px 2px;border-radius:6px;min-height:30px;font-size:12px}
.cal-today{background:#E3F5FC;color:var(--blue);font-weight:700}
.cal-event{background:#FEF5E3;color:#B8760A;font-weight:600}
.cal-past{color:#C5CAD0}
.cal-other{color:#C5CAD0}
.event-dot{width:5px;height:5px;border-radius:50%;display:inline-block;margin:0 1px}
.loading{text-align:center;padding:80px 20px;color:var(--muted)}
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 14px}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:30px;color:var(--muted);font-size:12px}
.doc-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:10px}
.deadline-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;margin-bottom:6px}
.agency-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px}
.action-item{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid #EDF0F3}
.num-badge{background:#E3F5FC;color:#0077B5;border-radius:50%;width:20px;height:20px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0}
@media(max-width:700px){.grid2,.grid3{grid-template-columns:1fr}}
</style>
</head>

</div>

let DATA = {};
let TAB = 'overview';

function updateDate() {
  var now = new Date();
  document.getElementById('hdr-date').innerHTML = '<div style="font-size:13px;font-weight:600">' + now.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'}) + '</div><div style="font-size:11px;opacity:.75;margin-top:3px">UNICEF · UNESCO · UNFPA · UNHCR</div>';
}
updateDate();
setInterval(updateDate, 60000);

document.getElementById('tabs').addEventListener('click', function(e) {
  var t = e.target.closest('.tab');
  if (!t) return;
  document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('active');});
  t.classList.add('active');
  TAB = t.dataset.tab;
  render();
});

async function fetchTable(t) {
  try {
    var controller = new AbortController();
    var timer = setTimeout(function(){ controller.abort(); }, 6000);
    var r = await fetch(URL + '/rest/v1/' + t + '?select=*&order=id', {
      signal: controller.signal,
      headers: {
        'apikey': KEY,
        'Authorization': 'Bearer ' + KEY,
        'Accept': 'application/json'
      }
    });
    clearTimeout(timer);
    if (!r.ok) return [];
    return await r.json();
  } catch(e) { return []; }
}

async function loadAll() {
  // Show static data immediately
  DATA = JSON.parse(JSON.stringify(STATIC));
  render();
  // Then try to load live data from Supabase in background
  document.querySelector('.refresh-bar span').textContent = 'Loading live data from Supabase...';
  var tables = ['agencies','meetings','reporting','jwp','documents','osc','jsc'];
  var loaded = 0;
  for (var i = 0; i < tables.length; i++) {
    var live = await fetchTable(tables[i]);
    if (live && live.length > 0) {
      DATA[tables[i]] = live;
      loaded += live.length;
    }
  }
  if (loaded > 0) {
    document.querySelector('.refresh-bar span').textContent = 'Live data from Supabase ✓';
    render();
  } else {
    document.querySelector('.refresh-bar span').textContent = 'Showing cached data (Supabase unavailable)';
  }
}

function fmt(d) {
  if (!d) return '—';
  try { return new Date(d).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}); } catch(e) { return d; }
}

function daysLeft(d) {
  if (!d) return '';
  var diff = Math.ceil((new Date(d) - TODAY) / 86400000);
  if (diff < 0) return '<span class="dl-past">' + Math.abs(diff) + 'd ago</span>';
  if (diff === 0) return '<span class="dl-danger">Today!</span>';
  if (diff === 1) return '<span class="dl-danger">Tomorrow</span>';
  if (diff <= 7) return '<span class="dl-danger">' + diff + 'd left</span>';
  if (diff <= 30) return '<span class="dl-warn">' + diff + 'd left</span>';
  return '<span class="dl-ok">' + diff + 'd left</span>';
}

function badge(s) {
  if (!s || s === '—') return '<span class="badge b-grey">—</span>';
  var m = {Upcoming:'b-blue',Completed:'b-green',Submitted:'b-green','On Track':'b-green','At Risk':'b-amber',Delayed:'b-red','Not Started':'b-grey','In Progress':'b-amber',TBD:'b-grey','Lead Convenor':'b-blue','Co-Lead':'b-purple',Member:'b-grey',Agenda:'b-blue',MOM:'b-green','Annual Report':'b-green','Concept Note':'b-purple'};
  return '<span class="badge ' + (m[s] || 'b-grey') + '">' + s + '</span>';
}

function openBtn(link, label, color) {
  if (!link) return '<span style="color:#B0BEC5;font-size:11px">—</span>';
  return '<a href="' + link + '" target="_blank" class="open-btn" style="background:' + (color||'#1CABE2') + '">' + (label||'Open ↗') + '</a>';
}

function progBar(p, s) {
  var pct = Math.min(100, Math.max(0, parseInt(p) || 0));
  var c = s === 'On Track' ? '#00833D' : s === 'At Risk' ? '#E6A817' : s === 'Delayed' ? '#C0392B' : '#BDC5CE';
  return '<div class="prog-wrap"><div class="prog" style="width:' + pct + '%;background:' + c + '"></div></div><div style="font-size:10px;color:var(--muted);margin-top:2px">' + pct + '%</div>';
}

function render() {
  var fns = {overview:overview, about:about, meetings:meetings, reporting:reporting, jwp:jwp, osc:osc, jsc:jsc, documents:documents, unsdcf:unsdcf};
  document.getElementById('content').innerHTML = fns[TAB]();
}

function overview() {
  var html = '<div class="grid2">';

  // Upcoming events
  var events = [];
  (DATA.meetings||[]).forEach(function(m) {
    if (m.date && m.status === 'Upcoming') events.push({title:m.type, date:m.date, sub:m.chair||'', link:m.agenda_link||''});
  });
  (DATA.osc||[]).forEach(function(o) {
    if (o.date) events.push({title:'OSC — ' + (o.ministry||'Ministry'), date:o.date, sub:o.chair||'', link:''});
  });
  (DATA.jsc||[]).forEach(function(j) {
    if (j.date) events.push({title:'JSC — Joint Steering Committee', date:j.date, sub:j.chair||'', link:''});
  });
  (DATA.reporting||[]).forEach(function(r) {
    if (r.deadline && r.status !== 'Submitted' && r.status !== 'Completed') events.push({title:r.item, date:r.deadline, sub:r.lead||'', link:r.doc_link||''});
  });
  events = events.filter(function(e) { return e.date; });
  events.sort(function(a,b) { return a.date > b.date ? 1 : -1; });

  html += '<div class="card"><div class="sec-title">Upcoming events</div><div class="tl">';
  if (events.length === 0) {
    html += '<div class="empty">No upcoming events</div>';
  } else {
    events.slice(0,7).forEach(function(x) {
      var diff = Math.ceil((new Date(x.date) - TODAY) / 86400000);
      var col = diff < 0 ? '#9EA8B3' : diff <= 7 ? '#E6A817' : '#1CABE2';
      html += '<div class="tl-item"><div class="tl-dot" style="background:' + col + ';box-shadow:0 0 0 2px ' + col + '"></div>';
      html += '<div class="tl-date">' + fmt(x.date) + ' ' + daysLeft(x.date) + '</div>';
      html += '<div class="tl-title">' + x.title + '</div>';
      html += '<div class="tl-sub">' + x.sub + '</div>';
      if (x.link) html += '<a href="' + x.link + '" target="_blank" class="open-btn" style="background:#1CABE2;margin-top:5px;display:inline-block">Open Agenda ↗</a>';
      html += '</div>';
    });
  }
  html += '</div></div>';

  // Right column
  html += '<div>';

  // Action points
  html += '<div class="card"><div class="sec-title">📌 Open Action Points</div>';
  var lastMtg = null;
  (DATA.meetings||[]).forEach(function(m) {
    if (m.notes && m.notes.trim()) {
      if (!lastMtg || m.date > lastMtg.date) lastMtg = m;
    }
  });
  if (lastMtg && lastMtg.notes) {
    var items = lastMtg.notes.split('\n').filter(function(l){return l.trim();});
    html += '<div style="font-size:11px;color:var(--muted);margin-bottom:8px">From: ' + lastMtg.type + ' — ' + fmt(lastMtg.date) + '</div>';
    items.forEach(function(a, i) {
      html += '<div class="action-item"><div class="num-badge">' + (i+1) + '</div><div style="font-size:12px;line-height:1.5">' + a + '</div></div>';
    });
  } else {
    html += '<div style="font-size:12px;color:var(--muted);padding:16px 0;text-align:center">No action points yet. Add them in the <b>notes</b> column of the meetings table in Supabase.</div>';
  }
  html += '</div>';

  // Next 5 deadlines
  html += '<div class="card"><div class="sec-title">⏰ Next 5 Deadlines</div>';
  var deadlines = [];
  (DATA.meetings||[]).forEach(function(m) {
    if (m.date && m.status === 'Upcoming') deadlines.push({title:m.type, date:m.date, type:'Meeting', color:'#1CABE2'});
  });
  (DATA.osc||[]).forEach(function(o) {
    if (o.date) deadlines.push({title:'OSC', date:o.date, type:'OSC', color:'#006D77'});
  });
  (DATA.jsc||[]).forEach(function(j) {
    if (j.date) deadlines.push({title:'JSC', date:j.date, type:'JSC', color:'#6C3B8C'});
  });
  (DATA.reporting||[]).forEach(function(r) {
    if (r.deadline && r.status !== 'Submitted' && r.status !== 'Completed') deadlines.push({title:r.item, date:r.deadline, type:'Report', color:'#E6A817'});
  });
  deadlines = deadlines.filter(function(d) {
    try { return new Date(d.date) >= new Date(TODAY.toDateString()); } catch(e) { return false; }
  });
  deadlines.sort(function(a,b) { return a.date > b.date ? 1 : -1; });
  if (deadlines.length === 0) {
    html += '<div class="empty">No upcoming deadlines</div>';
  } else {
    deadlines.slice(0,5).forEach(function(d) {
      var diff = Math.ceil((new Date(d.date) - TODAY) / 86400000);
      var bg = diff <= 3 ? '#FDE8E7' : diff <= 7 ? '#FEF5E3' : '#F0F5FA';
      var tc = diff <= 3 ? '#C0392B' : diff <= 7 ? '#B8760A' : '#1A2533';
      var label = diff === 0 ? 'Today!' : diff === 1 ? 'Tomorrow' : diff + 'd';
      html += '<div class="deadline-item" style="background:' + bg + '">';
      html += '<div style="width:3px;height:36px;background:' + d.color + ';border-radius:2px;flex-shrink:0"></div>';

var calYear = TODAY.getFullYear();
var calMonth = TODAY.getMonth();

function changeMonth(dir) {
  calMonth += dir;
  if (calMonth > 11) { calMonth = 0; calYear++; }
  if (calMonth < 0) { calMonth = 11; calYear--; }
  render();
}

function meetings() {
  var mtgs = DATA.meetings || [];
  var year = calYear, month = calMonth;
  var firstDay = new Date(year, month, 1).getDay();
  var daysInMonth = new Date(year, month+1, 0).getDate();
  var monthName = new Date(year, month, 1).toLocaleDateString('en-GB',{month:'long',year:'numeric'});

  var evMap = {};
  var allEvts = [];
  (DATA.meetings||[]).forEach(function(m){if(m.date) allEvts.push({date:m.date,title:m.type,color:'#1CABE2'});});
  (DATA.osc||[]).forEach(function(o){if(o.date) allEvts.push({date:o.date,title:'OSC',color:'#006D77'});});
  (DATA.jsc||[]).forEach(function(j){if(j.date) allEvts.push({date:j.date,title:'JSC',color:'#6C3B8C'});});
  (DATA.reporting||[]).forEach(function(r){if(r.deadline) allEvts.push({date:r.deadline,title:r.item,color:'#E6A817'});});
  allEvts.forEach(function(e) {
    var d = new Date(e.date);
    if (d.getMonth() === month && d.getFullYear() === year) {
      var day = d.getDate();
      if (!evMap[day]) evMap[day] = [];
      evMap[day].push(e);
    }
  });

  var calHtml = '<div class="card" style="min-width:280px;max-width:340px">';
  calHtml += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">';
  calHtml += '<button onclick="changeMonth(-1)" style="background:#F0F5FA;border:1px solid #DDE6EE;border-radius:6px;padding:4px 10px;cursor:pointer;font-size:14px;color:#003A5D;font-weight:600">‹</button>';
  calHtml += '<div style="font-weight:600;font-size:14px">' + monthName + '</div>';
  calHtml += '<button onclick="changeMonth(1)" style="background:#F0F5FA;border:1px solid #DDE6EE;border-radius:6px;padding:4px 10px;cursor:pointer;font-size:14px;color:#003A5D;font-weight:600">›</button>';
  calHtml += '<div style="display:flex;gap:8px;font-size:10px;color:var(--muted)">';
  calHtml += '<span><span style="color:#1CABE2">●</span> Meeting</span><span><span style="color:#006D77">●</span> OSC</span><span><span style="color:#6C3B8C">●</span> JSC</span><span><span style="color:#E6A817">●</span> Deadline</span>';
  calHtml += '</div></div>';
  calHtml += '<div class="cal-grid">';
  ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].forEach(function(d){calHtml += '<div class="cal-dh">' + d + '</div>';});
  var blanks = firstDay === 0 ? 6 : firstDay - 1;
  for (var i = 0; i < blanks; i++) calHtml += '<div class="cal-day cal-other"></div>';
  for (var d = 1; d <= daysInMonth; d++) {
    var isToday = d === TODAY.getDate();
    var isPast = new Date(year, month, d) < new Date(TODAY.toDateString());
    var evs = evMap[d] || [];
    var cls = isToday ? 'cal-today' : evs.length > 0 ? 'cal-event' : isPast ? 'cal-past' : '';
    var tip = evs.map(function(e){return e.title;}).join(', ');
    calHtml += '<div class="cal-day ' + cls + '" title="' + tip + '">' + d;
    if (evs.length > 0) {
      calHtml += '<div style="display:flex;justify-content:center;gap:1px;margin-top:2px">';
      evs.slice(0,3).forEach(function(e){calHtml += '<span class="event-dot" style="background:' + e.color + '"></span>';});
      calHtml += '</div>';
    }
    calHtml += '</div>';
  }
  calHtml += '</div></div>';

  var tblHtml = '<div class="card"><div class="sec-title">All meetings</div><div style="overflow-x:auto"><table>';
  tblHtml += '<tr><th>Type</th><th>Date</th><th>Time</th><th>Chair</th><th>Status</th><th>Agenda</th><th>MOM</th></tr>';
  if (mtgs.length === 0) {
    tblHtml += '<tr><td colspan="7" class="empty">No meetings data</td></tr>';
  } else {
    mtgs.forEach(function(m) {
      tblHtml += '<tr>';
      tblHtml += '<td><b>' + (m.type||'—') + '</b><br><span style="color:var(--muted);font-size:11px">' + (m.venue||'') + '</span></td>';
      tblHtml += '<td>' + fmt(m.date) + '<br>' + daysLeft(m.date) + '</td>';
      tblHtml += '<td>' + (m.time||'—') + '</td>';
      tblHtml += '<td>' + (m.chair||'—') + '</td>';
      tblHtml += '<td>' + badge(m.status) + '</td>';
      if (m.agenda_link) {
        tblHtml += '<td><a href="' + m.agenda_link + '" target="_blank" class="open-btn" style="background:#1CABE2">' + (m.agenda||'Open Agenda') + ' ↗</a></td>';
      } else {
        tblHtml += '<td><span style="font-size:12px;color:var(--muted)">' + (m.agenda||'—') + '</span></td>';
      }
      tblHtml += '<td>' + openBtn(m.mom_link, 'Open MOM ↗', '#006D77') + '</td>';
      tblHtml += '</tr>';
    });
  }
  tblHtml += '</table></div></div>';

  return '<div style="display:grid;grid-template-columns:340px 1fr;gap:14px;align-items:start">' + calHtml + tblHtml + '</div>';
}

  html += '<div style="background:#FDE8E7;border-radius:8px;padding:10px;margin-bottom:10px">';

  // Key Design Principles
  html += '<div class="card">';

  html += '</div>';
  html += '</div>';
  html += '</div>';
